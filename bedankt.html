<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedankt | Give a Day</title>
<meta name="robots" content="noindex">
<link rel="icon" href="images/g-purple.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'F37 Judge'; src: url('fonts/F37Judge-BoldCondensed.ttf') format('truetype'); font-weight: 700; font-display: swap; }
:root { --lilac:#C194FF; --lime:#E5FC54; --ink:#0A0A0A; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: 'DM Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.5; color: #fff; background: #000; padding: 24px; text-align: center; }
.gradbar { position: fixed; top: 0; left: 0; right: 0; height: 10px; background: linear-gradient(90deg,#2453FF 0%,#8E7BFF 14%,#C194FF 24%,#E5FC54 42%,#56D0D6 58%,#E5FC54 74%,#C194FF 86%,#2453FF 100%); }
.box { max-width: 560px; }
img { width: 64px; margin: 0 auto 24px; }
h1 { font-family: 'F37 Judge','Oswald','Arial Narrow',sans-serif; text-transform: uppercase; font-size: clamp(2.6rem, 8vw, 4.5rem); line-height: .9; margin: 0 0 18px; }
h1 span { color: var(--lime); }
p { color: rgba(255,255,255,.8); margin: 0 0 28px; }
.btn { display: inline-flex; padding: 15px 28px; border-radius: 999px; background: var(--lilac); color: #000; font-weight: 700; font-size: 15px; text-decoration: none; }
</style>
<!-- Conversietracking: plaats hier je GA4-event, LinkedIn Insight of Meta Pixel code.
     De URL bevat ?src=teambuilding zodat je de bron kan onderscheiden. -->
</head>
<body>
<div class="gradbar"></div>
<div class="box">
  <img src="images/g-purple.png" alt="Give a Day">
  <h1>Bedankt, <span>we nemen snel contact op</span></h1>
  <p>Je aanvraag is goed aangekomen. Binnen twee werkdagen hoor je van ons met een voorstel op maat. Dringend? Mail naar <a href="mailto:info@giveaday.eu" style="color:#fff">info@giveaday.eu</a>.</p>
  <a class="btn" href="index.html">Terug naar de site</a>
</div>
</body>
</html>
